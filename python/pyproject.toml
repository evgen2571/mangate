[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "mangate"
version = "0.1.2"
description = "Python API for the Mangate authorized manga downloader"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "evgen2571", email = "evgen.10.02.2008.83@gmail.com"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
mangate = "mangate._binary:main"

[project.urls]
Homepage = "https://github.com/evgen2571/mangate"
Documentation = "https://github.com/evgen2571/mangate#readme"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mangate"]

[dependency-groups]
dev = [
    "hatchling==1.28.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["mangate"]
